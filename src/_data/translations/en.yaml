lang: en
title: No Meat Proxy
description: AI is a tool. You shouldn't be.
ogSiteName: No Meat Proxy
ogImageAlt: "No Meat Proxy logo next to the tagline: AI is a tool. You shouldn't be."
brand:
  logoAlt: No Meat Proxy logo
hook: AI is a tool. You shouldn't be.
example1:
  heading: Don't paste AI responses to people
  dontLabel: ✕ Don't
  doLabel: ✓ Do
  question: Hey, how do the feature toggles work? Can we specify per user?
  dontAnswer: >-
    The feature flag system here is a config based custom implementation. Definition: a
    FeatureToggles class — a @ConfigurationProperties data class with boolean fields (e.g.
    enableNewCheckoutFlow, useOptimizedSearchIndex), registered via @EnableConfigurationProperties
    in a FeatureConfig class. Usage pattern: inject FeatureToggles and branch on the property, e.g.
    if (!featureToggles.enableNewCheckoutFlow) throw a ForbiddenException. Some flags gate an early
    return/exception, others switch between implementations entirely. Configuration is plain YAML
    under app.feature-toggles.*, with per-profile overrides, and since it's standard
    @ConfigurationProperties, it's also overridable via env vars. This means that toggling a feature
    per user is not possible given today's implementation.
  doAnswer: I'm afraid not. It's a hardcoded on and off switch.
  paragraph1: >-
    By simply regurgitating what an AI gave, you made everything much harder on the one who asked
    the question. AI-generated answers tend to be long-winded, over-complicated and often include
    details that weren't requested. They asked you because they trusted your judgment. By simply
    forwarding AI output, you're just acting as a middleman. You're just a meat proxy.
  paragraph2: If all you do is relay messages between people and an AI, what value do you bring?
  consequencesIntro: "By replying with AI answers, you're:"
  consequences:
    - making it harder for everyone else.
    - highlighting your own replaceability.
    - not actually being helpful.
    - looking unprofessional.
    - making people trust you less.
  avoidHeading: "More things to avoid:"
  avoidList:
    - Don't "contribute" to discussion by pasting wall-of-text AI results.
    - >-
      Don't ask questions like "Hey, so I have this problem: <Big ass AI-generated block of
      text>".
  insteadHeading: "Here is what you should try instead:"
  insteadList:
    - Do read and verify AI output.
    - Do formulate your own answers and questions.
    - Do contribute to discussions when you have something meaningful to contribute.
  closing: Answer people like a person. Treat people like people. Don't be a meat proxy!
example2:
  heading: Don't submit AI-generated work you don't understand or haven't verified
  dontLabel: ✕ Don't
  doLabel: ✓ Do
  reviewComment1: Why are we swallowing this error instead of letting it propagate?
  dontReviewComment2: lol, idk, Claude wrote it.
  doReviewComment2: >-
    Upstream retries on any thrown error, and this one's expected during backfills, so we log and
    drop it here to avoid a retry storm. I'll add a comment. Should I create a backlog ticket for
    rewriting upstream when we got the time?
  paragraph1: >-
    Even if AI did most of the work, you're still responsible for it, and it has your name on it. If
    your name is on it, it's your work. It is your responsibility to understand, verify and own the
    work that has been done.
  consequencesIntro: "By blindly submitting AI work you're:"
  consequences:
    - putting the burden on other people to understand and verify your work.
    - showing disrespect by forcing others to do what you can't be bothered to do yourself.
    - showing others that your work needs to be double-checked.
    - looking unprofessional.
    - showcasing how replaceable you are.
  avoidHeading: "More things to avoid:"
  avoidList:
    - Don't reply to feedback to your work with AI responses.
    - Don't blame the AI when getting feedback.
    - Don't excuse the lack of knowledge because "AI did it".
    - Don't let standards slip just because AI is involved.
  insteadHeading: "Here is what you should try instead:"
  insteadList:
    - Read, understand and verify the work.
    - Reply to feedback as the owner of the work.
    - >-
      Take responsibility for the work as if it was your own (it has your name on it, so it is
      yours).
    - Show others that you care about what you're doing.
  closing: >-
    Take ownership over work that has your name on it. Be someone people can rely on. Don't be a
    meat proxy.
