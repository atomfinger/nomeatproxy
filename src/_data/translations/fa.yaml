example1:
  heading: جواب‌های هوش مصنوعی رو برای آدم‌ها کپی‌پیست نکن
  dontLabel: ✕ این‌طوری نه
  doLabel: ✓ این‌طوری
  question: سلام، فیچر فلگ‌ها چطوری کار می‌کنن؟ می‌شه برای هر کاربر جدا تنظیمشون کرد؟
  # \u200E is a left-to-right mark. It keeps the @, .* and ) of the code identifiers attached to
  # them inside right-to-left text.
  dontAnswer: "سامانه‌ی پرچم‌های ویژگی (Feature Flags) در این پروژه، یک پیاده‌سازی سفارشی مبتنی بر
    پیکربندی است. تعریف: کلاس FeatureToggles — یک data class مبتنی بر \u200E@ConfigurationProperties
    با فیلدهای بولی (برای نمونه enableNewCheckoutFlow و useOptimizedSearchIndex) که از طریق
    \u200E@EnableConfigurationProperties در کلاس FeatureConfig ثبت شده است. الگوی استفاده:
    FeatureToggles تزریق شده و بر اساس مقدار ویژگی مورد نظر، انشعاب ایجاد می‌شود؛ برای مثال:
    if (!featureToggles.enableNewCheckoutFlow)\u200E یک استثنای ForbiddenException پرتاب می‌شود. برخی از
    پرچم‌ها یک return یا exception زودهنگام را کنترل می‌کنند و برخی دیگر به‌طور کامل میان
    پیاده‌سازی‌ها جابه‌جا می‌شوند. پیکربندی به‌صورت YAML ساده ذیل app.feature-toggles.*\u200E و با
    امکان بازنویسی به ازای هر پروفایل انجام می‌شود و از آن‌جا که یک \u200E@ConfigurationProperties
    استاندارد است، از طریق متغیرهای محیطی (Environment Variables) نیز قابل بازنویسی است. این بدان
    معناست که با پیاده‌سازی فعلی، فعال‌سازی یک ویژگی به ازای هر کاربر امکان‌پذیر نیست."
  doAnswer: نه متأسفانه. یه سوییچ روشن/خاموشه که هاردکد شده.
  paragraph1: >-
    وقتی خروجی هوش مصنوعی رو فقط نشخوار می‌کنی، کار رو برای کسی که سؤال پرسیده خیلی سخت‌تر می‌کنی.
    جواب‌های هوش مصنوعی معمولاً کش‌دار و بی‌خودی پیچیده‌ان و پر از جزئیاتی که کسی نخواسته. طرف
    از تو پرسید چون به تشخیص خودت اعتماد داشت. وقتی فقط خروجی هوش مصنوعی رو فوروارد می‌کنی، نقشت
    شده یه واسطه‌ی ساده. شدی یه پروکسی گوشتی.
  paragraph2: >-
    اگه تنها کارت اینه که پیام‌ها رو بین آدم‌ها و هوش مصنوعی دست‌به‌دست کنی، دقیقاً چه ارزشی اضافه
    می‌کنی؟
  consequencesIntro: 'وقتی با خروجی هوش مصنوعی جواب می‌دی:'
  consequences:
    - کار رو برای بقیه سخت‌تر می‌کنی.
    - جایگزین‌پذیر بودنت رو به رخ می‌کشی.
    - در واقع کمکی نمی‌کنی.
    - غیرحرفه‌ای به نظر می‌رسی.
    - کاری می‌کنی که بقیه کمتر بهت اعتماد کنن.
  avoidHeading: 'این کارها رو هم نکن:'
  avoidList:
    - با کپی کردن طومارهای هوش مصنوعی توی بحث «مشارکت» نکن.
    - 'سؤال‌هایی مثل «سلام، یه مشکلی دارم: <یه طومار گنده از خروجی هوش مصنوعی>» نپرس.'
  insteadHeading: 'به‌جاش این کارها رو امتحان کن:'
  insteadList:
    - خروجی هوش مصنوعی رو بخون و درستیش رو چک کن.
    - جواب‌ها و سؤال‌هات رو با کلمه‌های خودت بنویس.
    - هر وقت حرف به‌دردبخوری برای گفتن داشتی، توی بحث‌ها شرکت کن.
  closing: مثل یه آدم جواب آدم‌ها رو بده. با آدم‌ها مثل آدم رفتار کن. پروکسی گوشتی نباش!
example2:
  heading: کاری رو که هوش مصنوعی کرده و نمی‌فهمیش یا چکش نکردی، تحویل نده
  dontLabel: ✕ این‌طوری نه
  doLabel: ✓ این‌طوری
  reviewComment1: چرا این ارور رو اینجا swallow می‌کنیم، به‌جای این‌که بذاریم propagate بشه؟
  dontReviewComment2: lol، نمی‌دونم، Claude نوشته‌تش.
  doReviewComment2: >-
    upstream روی هر اروری که throw بشه ریترای می‌کنه و این یکی هم موقع backfill طبیعیه، واسه همین
    اینجا لاگش می‌کنیم و دراپش می‌کنیم که retry storm راه نیفته. یه کامنت هم براش می‌ذارم. یه تیکت
    تو بک‌لاگ بزنم که سر فرصت upstream رو بازنویسی کنیم؟
  paragraph1: >-
    حتی اگه بیشتر کار رو هوش مصنوعی کرده باشه، باز هم مسئولیتش با توئه و اسم تو روشه. وقتی اسمت
    روشه، یعنی کار خودته. فهمیدن، چک کردن و گردن گرفتن کاری که انجام شده، مسئولیت خودته.
  consequencesIntro: 'وقتی کار هوش مصنوعی رو چشم‌بسته تحویل می‌دی:'
  consequences:
    - بار فهمیدن و چک کردن کارت رو می‌ندازی گردن بقیه.
    - با مجبور کردن بقیه به کاری که خودت حوصله‌ش رو نداشتی، بهشون بی‌احترامی می‌کنی.
    - به بقیه نشون می‌دی که کارت باید دوباره چک بشه.
    - غیرحرفه‌ای به نظر می‌رسی.
    - نشون می‌دی چقدر راحت می‌شه جایگزینت کرد.
  avoidHeading: 'این کارها رو هم نکن:'
  avoidList:
    - فیدبک‌های کارت رو با خروجی هوش مصنوعی جواب نده.
    - وقتی فیدبک می‌گیری، تقصیر رو گردن هوش مصنوعی ننداز.
    - ندونستنت رو با «کار هوش مصنوعی بود» توجیه نکن.
    - فقط چون پای هوش مصنوعی وسطه، استانداردهات رو پایین نیار.
  insteadHeading: 'به‌جاش این کارها رو امتحان کن:'
  insteadList:
    - کار رو بخون، بفهم و چک کن.
    - به فیدبک‌ها به‌عنوان مسئول اون کار جواب بده.
    - مسئولیت کار رو طوری قبول کن که انگار مال خودته (اسمت روشه، پس مال خودته).
    - به بقیه نشون بده که کاری که می‌کنی برات مهمه.
  closing: کاری رو که اسمت روشه گردن بگیر. کسی باش که بقیه بتونن روش حساب کنن. پروکسی گوشتی نباش.
